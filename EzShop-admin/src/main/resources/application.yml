# Tomcat 配置
server:
  address: 0.0.0.0
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 13830

  servlet:
    encoding:
      # 响应编码
      charset: UTF-8
      # 强制覆盖
      force: true
      enabled: true
    session:
      cookie:
        http-only: true

# SpringBoot 核心配置
spring:
  profiles:
    active: dev

  # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    password:    # 密码 (默认为空)
    timeout: 6000ms  # 连接超时时长 (毫秒)
    lettuce:
      pool:
        max-active: 100  # 连接池最大连接数 (使用负值表示没有限制)
        max-wait: -1ms    # 连接池最大阻塞等待时间 (使用负值表示没有限制)
        max-idle: 10      # 连接池中的最大空闲连接
        min-idle: 5       # 连接池中的最小空闲连接

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 250MB
      enabled: true

  # 兼容 Knife4j / Swagger 接口文档
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  # jackson 时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  # 是否启用重复 Bean 覆盖
  main:
    allow-bean-definition-overriding: false

# Shiro 过滤器白名单
shiro:
  anon-paths:
    # 认证接口 (公开)
    - /admin/auth/login
    # 接口文档
    - /doc.html
    - /webjars/**
    - /swagger-resources/**
    - /v2/api-docs/**
    - /v3/api-docs/**
    # 监控 / 验证码
    - /druid/**
    - /captcha/**
    # 静态资源
    - /static/**
    - /favicon.ico
    - /**/favicon.ico
    # 错误页
    - /error

# Swagger 接口文档配置
knife4j:
  enable: false
  setting:
    enableFooter: false

# Mybatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: cn.hoshiikunn.ezshop.modules.**.entity
  global-config:
    # 数据库相关配置
    db-config:
      # 主键类型 雪花算法
      id-type: ASSIGN_ID
    banner: false
  # 原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'