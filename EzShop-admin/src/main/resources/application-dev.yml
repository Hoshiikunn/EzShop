# 数据库连接池配置
spring:
  datasource:
    druid:
      #MySQL
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/ez_shop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&useLocalSessionState=true&useSSL=false&allowPublicKeyRetrieval=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
      username: root
      password: 123456

      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 6000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      # 开启保活机制，防止连接被回收或被服务端断开
      keep-alive: true
      # 配合 keep-alive，每隔 2 分钟检查一次
      keep-alive-between-time-millis: 120000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # 生产环境需设置 Druid 监控页登录
        # login-username: admin
        # login-password: admin
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false

# Swagger 接口文档配置
knife4j:
  enable: true
  setting:
    enableFooter: false

# SQL 日志
logging:
  level:
    cn.hoshiikunn.ezshop.modules: debug
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT令牌签发配置
token:
  secret: "XgzcyYkDArbr5eppm0JMex7lRn0Y+CHsZZvzZPtKianRSUnEF7zG+2/zJhSgP7it"
  expire: 8h

# OSS 存储配置
oss:
  # 通用文件
  common-file:
    # 文件大小上限
    max-size: 50MB
  # 图片
  image:
    max-size: 5MB
  # 视频
  video:
    max-size: 100MB

  # 本地
  local:
    # 本地绝对路径
    resource-path:
    # 本地相对路径
    relative-path: ./oss-data
    # 浏览器访问的根 URL
    domain: http://localhost:13830
